version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merrylay_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - Merrylay Enterprises-network
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_NAME=merrylay_system
      - DB_USER=merrylay_user
      - DB_PASS=secure_password_123
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: merrylay_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - Merrylay Enterprises-network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: merrylay_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: merrylay_system
      MYSQL_USER: merrylay_user
      MYSQL_PASSWORD: secure_password_123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - Merrylay Enterprises-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: merrylay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - Merrylay Enterprises-network
    command: redis-server /usr/local/etc/redis/redis.conf

  # Redis Commander (Redis Management UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: merrylay_redis_ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - Merrylay Enterprises-network
    depends_on:
      - redis

  # phpMyAdmin (Database Management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: merrylay_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: merrylay_user
      PMA_PASSWORD: secure_password_123
    networks:
      - Merrylay Enterprises-network
    depends_on:
      - mysql

networks:
  Merrylay Enterprises-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
