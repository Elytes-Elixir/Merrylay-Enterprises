# Apache Virtual Host Configuration for LAN Access
# Copy this to C:\xampp\apache\conf\extra\httpd-vhosts.conf

# Default localhost configuration
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
    <Directory "C:/xampp/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Merrylay Enterprises LAN Configuration
# Replace 192.168.1.100 with your server's actual IP address
<VirtualHost *:80>
    ServerName 192.168.1.100
    DocumentRoot "C:/xampp/htdocs/merrylay_system"
    <Directory "C:/xampp/htdocs/merrylay_system">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable compression
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript
        </IfModule>
        
        # Enable caching
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
        </IfModule>
    </Directory>
    
    # Error logs
    ErrorLog "logs/merrylay_error.log"
    CustomLog "logs/merrylay_access.log" common
</VirtualHost>
