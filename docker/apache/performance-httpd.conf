# ============================================================================
# APACHE PERFORMANCE OPTIMIZATION FOR MERRYLAY SYSTEM
# ============================================================================
# This configuration optimizes Apache for multi-user LAN performance
# Place these settings in your httpd.conf or httpd-vhosts.conf
# ============================================================================

# ----------------------------------------------------------------------------
# CONNECTION TUNING
# ----------------------------------------------------------------------------

# Maximum number of simultaneous connections
# For LAN with 5-10 concurrent users: 150-200
MaxRequestWorkers 150

# Minimum number of spare server processes
MinSpareServers 5

# Maximum number of spare server processes
MaxSpareServers 20

# Maximum number of requests per child process (prevents memory leaks)
MaxRequestsPerChild 10000

# Start with this many server processes
StartServers 5

# ----------------------------------------------------------------------------
# KEEPALIVE SETTINGS
# ----------------------------------------------------------------------------

# Enable persistent connections (reduces TCP overhead)
KeepAlive On

# Maximum number of requests per KeepAlive connection
# Lower for high concurrency, higher for low latency
MaxKeepAliveRequests 100

# Timeout for KeepAlive connections (seconds)
# 5 seconds is optimal for LAN - reduces idle connections
KeepAliveTimeout 5

# ----------------------------------------------------------------------------
# TIMEOUT SETTINGS
# ----------------------------------------------------------------------------

# Connection timeout (seconds)
Timeout 60

# ----------------------------------------------------------------------------
# COMPRESSION
# ----------------------------------------------------------------------------

# Enable gzip compression (reduces network transfer by 70-80%)
LoadModule deflate_module modules/mod_deflate.so

# Compress HTML, CSS, JavaScript, JSON, XML
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    BrowserMatch ^Mozilla/4 gzip-only-text/html
    BrowserMatch ^Mozilla/4\.0[678] no-gzip
    BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png)$ no-gzip dont-vary
    SetEnvIfNoCase Request_URI \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    SetEnvIfNoCase Request_URI \.pdf$ no-gzip dont-vary
</IfModule>

# ----------------------------------------------------------------------------
# BROWSER CACHING
# ----------------------------------------------------------------------------

# Enable expires module for static assets
LoadModule expires_module modules/mod_expires.so

<IfModule mod_expires.c>
    ExpiresActive On
    
    # Cache images for 1 year
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/gif "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    
    # Cache CSS/JS for 1 month (allows updates)
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    
    # Cache fonts for 1 year
    ExpiresByType font/woff "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    
    # Cache HTML for 1 hour (allows frequent updates)
    ExpiresByType text/html "access plus 1 hour"
</IfModule>

# ----------------------------------------------------------------------------
# OUTPUT BUFFERING
# ----------------------------------------------------------------------------

# Enable output buffering (reduces network round trips)
# Buffer size of 8KB is optimal for most applications
OutputBufferSize 8192

# ----------------------------------------------------------------------------
# SECURITY HEADERS
# ----------------------------------------------------------------------------

# Prevent clickjacking
Header always set X-Frame-Options "SAMEORIGIN"

# Prevent MIME type sniffing
Header always set X-Content-Type-Options "nosniff"

# Enable XSS protection
Header always set X-XSS-Protection "1; mode=block"

# ----------------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------------

# Reduce logging overhead (comment out in production)
# LogLevel debug
LogLevel warn

# Combined log format (standard)
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

# ----------------------------------------------------------------------------
# PERFORMANCE MODULES
# ----------------------------------------------------------------------------

# Enable HTTP/2 for multiplexing (requires Apache 2.4.17+)
# LoadModule http2_module modules/mod_http2.so
# Protocols h2 h2c http/1.1

# Enable caching for dynamic content
# LoadModule cache_module modules/mod_cache.so
# LoadModule cache_disk_module modules/mod_cache_disk.so
# CacheQuickHandler off
# CacheLock on

# ============================================================================
# END OF APACHE PERFORMANCE CONFIGURATION
# ============================================================================
