# MySQL Configuration for LAN Access
# Copy relevant sections to C:\xampp\mysql\bin\my.ini

[mysqld]
# Bind to all network interfaces for LAN access
bind-address = 0.0.0.0

# Increase connections for multiple users
max_connections = 200
max_user_connections = 50

# Performance optimizations
innodb_buffer_pool_size = 256M
innodb_log_file_size = 64M
innodb_log_buffer_size = 8M
innodb_flush_log_at_trx_commit = 2

# Query cache for better performance
query_cache_size = 32M
query_cache_type = 1
query_cache_limit = 2M

# Table cache
table_open_cache = 400
table_definition_cache = 400

# Thread cache
thread_cache_size = 8
thread_stack = 256K

# Network settings
max_allowed_packet = 64M
connect_timeout = 10
wait_timeout = 28800
interactive_timeout = 28800

# Character set
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci

# Logging
log_error = "mysql_error.log"
general_log = 0
slow_query_log = 1
slow_query_log_file = "slow_query.log"
long_query_time = 2

[client]
port = 3306
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4
