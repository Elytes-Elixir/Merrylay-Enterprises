; ============================================================================
; PHP PERFORMANCE OPTIMIZATION FOR MERRYLAY SYSTEM
; ============================================================================
; This configuration optimizes PHP for multi-user LAN performance
; Place these settings in your php.ini
; ============================================================================

; ----------------------------------------------------------------------------
; MEMORY SETTINGS
; ----------------------------------------------------------------------------

; Maximum memory per script (increase for heavy reports)
memory_limit = 256M

; ----------------------------------------------------------------------------
; EXECUTION TIME
; ----------------------------------------------------------------------------

; Maximum execution time per script (seconds)
; Increase for heavy report generation
max_execution_time = 120

; Maximum input parsing time (seconds)
max_input_time = 60

; ----------------------------------------------------------------------------
; POST SETTINGS
; ----------------------------------------------------------------------------

; Maximum POST size (for large forms/file uploads)
post_max_size = 20M

; Maximum upload file size
upload_max_filesize = 10M

; ----------------------------------------------------------------------------
; OPCACHE CRITICAL SETTINGS
; ----------------------------------------------------------------------------

; Enable OPcache (critical for performance!)
opcache.enable = 1

; OPcache memory size (increase for larger applications)
; 128MB is good for medium-sized applications
opcache.memory_consumption = 128

; Maximum number of cached scripts
opcache.max_accelerated_files = 10000

; Revalidate cache at this interval (seconds)
; 60 seconds is good balance between performance and updates
opcache.revalidate_freq = 60

; Save comments (disable for better performance)
opcache.save_comments = 1

; Enable fast shutdown
opcache.fast_shutdown = 1

; Enable file cache (prevents file stat calls)
opcache.enable_file_override = 1

; JIT compilation (PHP 8.0+)
; Set to 'tracing' for best performance on PHP 8+
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; ----------------------------------------------------------------------------
; SESSION SETTINGS
; ----------------------------------------------------------------------------

; Session handler (files is fine for small LAN, use Redis for scale)
session.save_handler = files

; Session garbage collection probability (1/100 = 1%)
session.gc_probability = 1
session.gc_divisor = 100

; Session lifetime (seconds)
session.gc_maxlifetime = 7200

; Use strict mode for session IDs (security)
session.use_strict_mode = 1

; Use cookies only (security)
session.use_only_cookies = 1

; Use secure cookies (enable if using HTTPS)
; session.cookie_secure = 1

; Use HTTP only cookies (security)
session.cookie_httponly = 1

; ----------------------------------------------------------------------------
; ERROR REPORTING
; ----------------------------------------------------------------------------

; Production error reporting (log only, don't display)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "C:\\xampp\\php\\logs\\php_error.log"

; Error reporting level (exclude notices in production)
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT

; ----------------------------------------------------------------------------
; REALPATH CACHE
; ----------------------------------------------------------------------------

; Enable realpath cache (reduces file system lookups)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ----------------------------------------------------------------------------
; OUTPUT BUFFERING
; ----------------------------------------------------------------------------

; Enable output buffering
output_buffering = 4096

; Implicit flush (disable for performance)
implicit_flush = Off

; ----------------------------------------------------------------------------
; DATE SETTINGS
; ----------------------------------------------------------------------------

; Default timezone (required for PHP 8+)
date.timezone = "Africa/Lagos"

; ----------------------------------------------------------------------------
; MYSQL/MYSQLND SETTINGS
; ----------------------------------------------------------------------------

; MySQL connection pooling
mysql.allow_persistent = On
mysql.max_persistent = 20
mysql.max_links = 100

; MySQLND settings (if using MySQL Native Driver)
mysqlnd.net_read_timeout = 30
mysqlnd.net_cmd_timeout = 30

; ----------------------------------------------------------------------------
; SECURITY SETTINGS
; ----------------------------------------------------------------------------

; Expose PHP version (disable for security)
expose_php = Off

; Allow URL fopen (disable for security)
allow_url_fopen = Off
allow_url_include = Off

; ----------------------------------------------------------------------------
; PERFORMANCE TUNING
; ----------------------------------------------------------------------------

; Enable zlib compression (alternative to Apache mod_deflate)
zlib.output_compression = On
zlib.output_compression_level = 6

; Short open tags (disable for compatibility)
short_open_tag = Off

; ASP tags (disable)
asp_tags = Off

; ============================================================================
; END OF PHP PERFORMANCE CONFIGURATION
; ============================================================================
