# PHP Configuration for LAN Access
# Copy relevant sections to C:\xampp\php\php.ini

[PHP]
; Performance optimizations
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=60
opcache.fast_shutdown=1
opcache.enable_cli=0

; Memory and execution limits
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 50M
post_max_size = 50M

; Session configuration for network
session.save_handler = files
session.save_path = "C:\xampp\tmp"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 86400
session.cookie_lifetime = 86400

; Output buffering
output_buffering = On
implicit_flush = Off
zlib.output_compression = On
zlib.output_compression_level = 6

; Error handling
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "C:\xampp\php\logs\php_error.log"
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; File uploads
file_uploads = On
upload_tmp_dir = "C:\xampp\tmp"

; Maximum file uploads
max_file_uploads = 20

; Date and timezone
date.timezone = Africa/Lagos

; Network settings
default_socket_timeout = 60

; Allow larger POST data
post_max_size = 50M

; Increase memory for image processing
memory_limit = 256M

; Enable realpath cache for better performance
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; Enable short tags
short_open_tag = On

; Enable ASP tags
asp_tags = Off

; Precision
precision = 14

; Enable zlib compression
zlib.output_compression = On
zlib.output_compression_level = 6

; Expose PHP version (security: set to Off in production)
expose_php = Off

; Disable dangerous functions (optional, for security)
; disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
